<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Income | Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Expense Tracker
    </div>

    <div class="nav-links">

        <a href="/">
            Dashboard
        </a>

        <a href="/expenses">
            Expenses
        </a>

        <a href="/income" class="active">
            Income
        </a>

        <a href="#">
            Reports
        </a>

    </div>

</nav>


<main class="container">

    <div class="form-container">

        <h1>Add Income</h1>

        <p class="form-description">
            Record a new income.
        </p>


        <form method="POST" action="/add-income">

            <div class="form-group">

                <label for="title">
                    Income Name
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: Salary"
                    required
                >

            </div>


            <div class="form-group">

                <label for="amount">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Example: 40000"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="source">
                    Income Source
                </label>

                <select id="source" name="source" required>

                    <option value="">
                        Select source
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Freelance">
                        Freelance
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Scholarship">
                        Scholarship
                    </option>

                    <option value="Investment">
                        Investment
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>


            <div class="form-actions">

                <a href="/" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="btn">
                    Save Income
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
