{% extends "base.html" %}


{% block title %}
Login | Expense Tracker
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Expense Tracker</h1>

        <h2>Welcome Back</h2>

        <p>
            Login to manage your finances.
        </p>


        {% if error %}

        <div class="auth-error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn auth-button">

                Login

            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>

    </div>

</div>

{% endblock %}
