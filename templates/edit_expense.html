<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense | Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>


<main class="container">

    <div class="form-container">

        <h1>Edit Expense</h1>

        <p class="form-description">
            Update your expense information.
        </p>


        <form method="POST">

            <div class="form-group">

                <label for="title">
                    Expense Name
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ expense.title }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="amount">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    value="{{ expense.amount }}"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="Food"
                        {% if expense.category == "Food" %}selected{% endif %}>
                        Food
                    </option>

                    <option value="Travel"
                        {% if expense.category == "Travel" %}selected{% endif %}>
                        Travel
                    </option>

                    <option value="Shopping"
                        {% if expense.category == "Shopping" %}selected{% endif %}>
                        Shopping
                    </option>

                    <option value="Bills"
                        {% if expense.category == "Bills" %}selected{% endif %}>
                        Bills
                    </option>

                    <option value="Education"
                        {% if expense.category == "Education" %}selected{% endif %}>
                        Education
                    </option>

                    <option value="Entertainment"
                        {% if expense.category == "Entertainment" %}selected{% endif %}>
                        Entertainment
                    </option>

                    <option value="Health"
                        {% if expense.category == "Health" %}selected{% endif %}>
                        Health
                    </option>

                    <option value="Other"
                        {% if expense.category == "Other" %}selected{% endif %}>
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ expense.date.strftime('%Y-%m-%d') }}"
                    required
                >

            </div>


            <div class="form-actions">

                <a href="/expenses" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="btn">
                    Update Expense
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
