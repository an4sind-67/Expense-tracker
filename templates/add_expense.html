<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense | Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="container">

        <div class="form-container">

            <h1>Add Expense</h1>

            <p class="form-description">
                Record a new expense.
            </p>


            <form method="POST" action="/add-expense">

                <div class="form-group">

                    <label for="title">
                        Expense Name
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Example: Lunch"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Example: 250"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" name="category" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <div class="form-actions">

                    <a href="/" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="btn">
                        Save Expense
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
